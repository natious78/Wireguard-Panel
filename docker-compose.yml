x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-production}
  APP_URL: ${APP_URL:-http://localhost:2040}
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-wireguard_control}
  DB_USER: ${POSTGRES_USER:-wireguard_control}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
  MIKROTIK_STATS_INTERVAL: ${MIKROTIK_STATS_INTERVAL:-30}
  EXPIRATION_INTERVAL_SECONDS: ${EXPIRATION_INTERVAL_SECONDS:-60}
  ROUTER_CONNECT_TIMEOUT_MS: ${ROUTER_CONNECT_TIMEOUT_MS:-8000}
  ROUTER_HEALTH_INTERVAL_SECONDS: ${ROUTER_HEALTH_INTERVAL_SECONDS:-60}
  BANDWIDTH_INTERVAL_SECONDS: ${BANDWIDTH_INTERVAL_SECONDS:-300}
  OPERATION_RECONCILIATION_INTERVAL_SECONDS: ${OPERATION_RECONCILIATION_INTERVAL_SECONDS:-60}
  TRAFFIC_AGGREGATION_INTERVAL_SECONDS: ${TRAFFIC_AGGREGATION_INTERVAL_SECONDS:-3600}
  MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-21600}
  RAW_TRAFFIC_SAMPLE_SECONDS: ${RAW_TRAFFIC_SAMPLE_SECONDS:-300}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HEALTH_WORKER_STALE_SECONDS: ${HEALTH_WORKER_STALE_SECONDS:-900}
  ONLINE_THRESHOLD_SECONDS: ${ONLINE_THRESHOLD_SECONDS:-180}
  RECENT_THRESHOLD_SECONDS: ${RECENT_THRESHOLD_SECONDS:-900}
  DEMO_MODE: ${DEMO_MODE:-false}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wireguard_control}
      POSTGRES_USER: ${POSTGRES_USER:-wireguard_control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]

  app:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-environment
      PORT: 2040
      HOSTNAME: 0.0.0.0
    ports:
      - "2040:2040"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2040/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [backend]

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.cjs"]
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
